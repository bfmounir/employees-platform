<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ملفي الوظيفي</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="config.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #f3f7fb;
            color: #1f2937;
        }

        .header {
            background: linear-gradient(135deg, #0f766e, #2563eb);
            color: white;
            padding: 22px 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,.12);
        }

        .header-content {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .title-box h1 {
            margin: 0 0 7px;
            font-size: 25px;
        }

        .title-box p {
            margin: 0;
            opacity: .9;
            font-size: 14px;
        }

        .logout-btn {
            border: none;
            background: rgba(255,255,255,.18);
            color: white;
            padding: 11px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: rgba(255,255,255,.28);
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .welcome {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
        }

        .welcome h2 {
            margin: 0 0 8px;
            color: #0f766e;
            font-size: 21px;
        }

        .welcome p {
            margin: 0;
            color: #64748b;
        }

        .status-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 12px;
            background: #f8fafc;
            border-right: 5px solid #94a3b8;
        }

        .status-box.pending {
            border-right-color: #f59e0b;
            background: #fffbeb;
        }

        .status-box.approved {
            border-right-color: #16a34a;
            background: #f0fdf4;
        }

        .status-box.correction {
            border-right-color: #dc2626;
            background: #fef2f2;
        }

        .status-title {
            font-weight: bold;
            margin-bottom: 7px;
        }

        .admin-note {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            color: #7f1d1d;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
        }

        .card-title {
            font-size: 19px;
            font-weight: bold;
            color: #0f766e;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 7px;
            color: #334155;
        }

        input,
        select {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            background: white;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.10);
        }

        input[readonly] {
            background: #f1f5f9;
            color: #64748b;
        }

        .required {
            color: #dc2626;
        }

        .seconded-box {
            margin-top: 20px;
            padding: 20px;
            background: #f0fdfa;
            border: 1px solid #99f6e4;
            border-radius: 12px;
        }

        .seconded-title {
            color: #0f766e;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
        }

        .save-btn {
            border: none;
            background: linear-gradient(135deg, #0f766e, #2563eb);
            color: white;
            padding: 14px 35px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            min-width: 220px;
        }

        .save-btn:hover {
            opacity: .92;
        }

        .save-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 13px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #64748b;
        }

        .hidden {
            display: none !important;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            padding: 20px;
        }

        @media (max-width: 700px) {

            .header {
                padding: 18px 15px;
            }

            .header-content {
                flex-direction: column;
                align-items: stretch;
            }

            .logout-btn {
                width: 100%;
            }

            .container {
                margin-top: 18px;
                padding: 0 10px;
            }

            .card {
                padding: 18px;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .field.full {
                grid-column: auto;
            }

            .title-box h1 {
                font-size: 21px;
            }

            .save-btn {
                width: 100%;
            }
        }

    </style>

</head>

<body>

<header class="header">

    <div class="header-content">

        <div class="title-box">

            <h1>المنصة الرقمية لتسيير الموظفين</h1>

            <p>الملف الوظيفي للموظف</p>

        </div>

        <button class="logout-btn" onclick="logout()">
            تسجيل الخروج
        </button>

    </div>

</header>


<div class="container">

    <div id="loading" class="loading">
        جاري تحميل ملفك...
    </div>


    <div id="pageContent" class="hidden">

        <div class="welcome">

            <h2 id="welcomeName">
                مرحبًا بك
            </h2>

            <p>
                يمكنك الاطلاع على بياناتك وتحديثها ثم إرسالها للمسؤول للمراجعة.
            </p>


            <div id="statusBox" class="status-box">

                <div class="status-title">
                    حالة الملف:
                    <span id="profileStatus">قيد المراجعة</span>
                </div>

                <div id="adminNote" class="admin-note hidden"></div>

            </div>

        </div>


        <form id="employeeForm">

            <div class="card">

                <div class="card-title">
                    المعلومات الشخصية
                </div>

                <div class="grid">

                    <div class="field">

                        <label>
                            الاسم واللقب بالعربية
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="nom_ar"
                            placeholder="مثال: بن صغير منير"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            Nom et prénom
                        </label>

                        <input
                            type="text"
                            id="nom_fr"
                            placeholder="Nom et prénom"
                        >

                    </div>


                    <div class="field">

                        <label>
                            رقم التعريف الوطني NIN
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="nin"
                            placeholder="رقم التعريف الوطني"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            البريد الإلكتروني
                            <span class="required">*</span>
                        </label>

                        <input
                            type="email"
                            id="email"
                            readonly
                        >

                    </div>


                    <div class="field">

                        <label>
                            رقم الهاتف الشخصي
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="مثال: 0660000000"
                        >

                    </div>

                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    المعلومات المهنية
                </div>

                <div class="grid">

                    <div class="field">

                        <label>
                            منصب العمل بالعربية
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="poste_ar"
                            placeholder="منصب العمل"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            Poste de travail
                        </label>

                        <input
                            type="text"
                            id="poste_fr"
                            placeholder="Poste de travail"
                        >

                    </div>


                    <div class="field">

                        <label>
                            مكان العمل بالعربية
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="lieu_travail_ar"
                            placeholder="مكان العمل"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            Lieu de travail
                        </label>

                        <input
                            type="text"
                            id="lieu_travail_fr"
                            placeholder="Lieu de travail"
                        >

                    </div>


                    <div class="field">

                        <label>
                            الرتبة
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="grade"
                            placeholder="الرتبة"
                            required
                        >

                    </div>


                    <div class="field">

                        <label>
                            المصلحة / المكتب بالعربية
                        </label>

                        <input
                            type="text"
                            id="service_ar"
                            placeholder="المصلحة أو المكتب"
                        >

                    </div>


                    <div class="field">

                        <label>
                            Service / Bureau
                        </label>

                        <input
                            type="text"
                            id="service_fr"
                            placeholder="Service / Bureau"
                        >

                    </div>


                    <div class="field">

                        <label>
                            الوضعية المهنية
                            <span class="required">*</span>
                        </label>

                        <select id="work_status" required>

                            <option value="active">
                                نشط بالمؤسسة
                            </option>

                            <option value="seconded">
                                موضوع تحت التصرف لدى مؤسسة أخرى
                            </option>

                        </select>

                    </div>

                </div>


                <div id="secondedSection" class="seconded-box hidden">

                    <div class="seconded-title">
                        معلومات الوضع تحت التصرف
                    </div>

                    <div class="grid">

                        <div class="field">

                            <label>
                                المؤسسة المستقبلة
                            </label>

                            <input
                                type="text"
                                id="host_institution"
                                placeholder="اسم المؤسسة المستقبلة"
                            >

                        </div>


                        <div class="field">

                            <label>
                                المصلحة / المكتب لدى المؤسسة المستقبلة
                            </label>

                            <input
                                type="text"
                                id="host_service"
                                placeholder="المصلحة أو المكتب"
                            >

                        </div>


                        <div class="field">

                            <label>
                                تاريخ بداية الوضع تحت التصرف
                            </label>

                            <input
                                type="date"
                                id="disposition_start"
                            >

                        </div>


                        <div class="field">

                            <label>
                                تاريخ نهاية الوضع تحت التصرف
                            </label>

                            <input
                                type="date"
                                id="disposition_end"
                            >

                        </div>

                    </div>

                </div>


                <div id="message" class="message"></div>


                <div class="actions">

                    <button
                        type="submit"
                        class="save-btn"
                        id="saveBtn"
                    >
                        حفظ وإرسال للمراجعة
                    </button>

                </div>

            </div>

        </form>

    </div>

</div>


<div class="footer">
    المنصة الرقمية لتسيير ومتابعة بيانات الموظفين
</div>


<script>

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    let currentUser = null;
    let existingEmployee = null;


    const loading =
        document.getElementById("loading");

    const pageContent =
        document.getElementById("pageContent");

    const form =
        document.getElementById("employeeForm");

    const workStatus =
        document.getElementById("work_status");

    const secondedSection =
        document.getElementById("secondedSection");

    const saveBtn =
        document.getElementById("saveBtn");

    const message =
        document.getElementById("message");


    async function loadEmployee() {

        try {

            const {
                data: {
                    user
                },
                error: authError
            } = await supabaseClient.auth.getUser();


            if (authError || !user) {

                window.location.href = "index.html";

                return;
            }


            currentUser = user;


            document.getElementById("email").value =
                user.email || "";


            const {
                data,
                error
            } = await supabaseClient
                .from("employees")
                .select("*")
                .eq("user_id", user.id)
                .maybeSingle();


            if (error) {

                throw error;

            }


            if (data) {

                existingEmployee = data;


                if (data.role === "admin") {

                    window.location.href = "admin.html";

                    return;
                }


                fillForm(data);

            }


            loading.classList.add("hidden");

            pageContent.classList.remove("hidden");


        } catch (error) {

            console.error(error);

            loading.innerHTML =
                "حدث خطأ أثناء تحميل الملف. يرجى تحديث الصفحة.";

        }

    }


    function fillForm(data) {

        document.getElementById("nom_ar").value =
            data.nom_ar || "";

        document.getElementById("nom_fr").value =
            data.nom_fr || "";

        document.getElementById("poste_ar").value =
            data.poste_ar || "";

        document.getElementById("poste_fr").value =
            data.poste_fr || "";

        document.getElementById("lieu_travail_ar").value =
            data.lieu_travail_ar || "";

        document.getElementById("lieu_travail_fr").value =
            data.lieu_travail_fr || "";

        document.getElementById("grade").value =
            data.grade || "";

        document.getElementById("nin").value =
            data.nin || "";

        document.getElementById("phone").value =
            data.phone || "";

        document.getElementById("service_ar").value =
            data.service_ar || "";

        document.getElementById("service_fr").value =
            data.service_fr || "";

        document.getElementById("work_status").value =
            data.work_status || "active";

        document.getElementById("host_institution").value =
            data.host_institution || "";

        document.getElementById("host_service").value =
            data.host_service || "";

        document.getElementById("disposition_start").value =
            data.disposition_start || "";

        document.getElementById("disposition_end").value =
            data.disposition_end || "";


        updateSecondedVisibility();

        updateStatus(data);

        document.getElementById("welcomeName").textContent =
            "مرحبًا " + (data.nom_ar || "بك");

    }


    function updateSecondedVisibility() {

        if (workStatus.value === "seconded") {

            secondedSection.classList.remove("hidden");

        } else {

            secondedSection.classList.add("hidden");

        }

    }


    workStatus.addEventListener(
        "change",
        updateSecondedVisibility
    );


    function updateStatus(data) {

        const statusBox =
            document.getElementById("statusBox");

        const statusText =
            document.getElementById("profileStatus");

        const adminNote =
            document.getElementById("adminNote");


        statusBox.classList.remove(
            "pending",
            "approved",
            "correction"
        );


        if (data.profile_status === "approved") {

            statusBox.classList.add("approved");

            statusText.textContent =
                "مقبول";

        }

        else if (data.profile_status === "needs_correction") {

            statusBox.classList.add("correction");

            statusText.textContent =
                "يحتاج إلى تصحيح";


            if (data.admin_note) {

                adminNote.textContent =
                    "ملاحظة المسؤول: " + data.admin_note;

                adminNote.classList.remove("hidden");

            }

        }

        else {

            statusBox.classList.add("pending");

            statusText.textContent =
                "قيد المراجعة";

        }

    }


    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (!currentUser) {

                return;
            }


            saveBtn.disabled = true;

            saveBtn.textContent =
                "جاري الحفظ...";


            message.className = "message";

            message.textContent = "";


            const workStatusValue =
                document.getElementById("work_status").value;


            const employeeData = {

                user_id: currentUser.id,

                role: existingEmployee?.role || "employee",

                nom_ar:
                    document.getElementById("nom_ar").value.trim(),

                nom_fr:
                    document.getElementById("nom_fr").value.trim(),

                poste_ar:
                    document.getElementById("poste_ar").value.trim(),

                poste_fr:
                    document.getElementById("poste_fr").value.trim(),

                lieu_travail_ar:
                    document.getElementById("lieu_travail_ar").value.trim(),

                lieu_travail_fr:
                    document.getElementById("lieu_travail_fr").value.trim(),

                grade:
                    document.getElementById("grade").value.trim(),

                nin:
                    document.getElementById("nin").value.trim(),

                email:
                    currentUser.email || "",

                phone:
                    document.getElementById("phone").value.trim(),

                service_ar:
                    document.getElementById("service_ar").value.trim(),

                service_fr:
                    document.getElementById("service_fr").value.trim(),

                work_status:
                    workStatusValue,

                host_institution:
                    workStatusValue === "seconded"
                        ? document.getElementById("host_institution").value.trim()
                        : null,

                host_service:
                    workStatusValue === "seconded"
                        ? document.getElementById("host_service").value.trim()
                        : null,

                disposition_start:
                    workStatusValue === "seconded"
                        ? document.getElementById("disposition_start").value || null
                        : null,

                disposition_end:
                    workStatusValue === "seconded"
                        ? document.getElementById("disposition_end").value || null
                        : null,

                profile_status: "pending",

                admin_note: null

            };


            try {

                let result;


                if (existingEmployee) {

                    result =
                        await supabaseClient
                            .from("employees")
                            .update(employeeData)
                            .eq("id", existingEmployee.id)
                            .eq("user_id", currentUser.id)
                            .select()
                            .single();

                } else {

                    result =
                        await supabaseClient
                            .from("employees")
                            .insert(employeeData)
                            .select()
                            .single();

                }


                if (result.error) {

                    throw result.error;

                }


                existingEmployee = result.data;


                updateStatus(existingEmployee);


                document.getElementById("welcomeName").textContent =
                    "مرحبًا " +
                    (existingEmployee.nom_ar || "بك");


                message.className =
                    "message success";

                message.textContent =
                    "تم حفظ بياناتك وإرسالها للمسؤول للمراجعة بنجاح.";


                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });


            } catch (error) {

                console.error(error);


                message.className =
                    "message error";

                message.textContent =
                    "حدث خطأ أثناء حفظ البيانات: " +
                    (error.message || "خطأ غير معروف");

            }


            saveBtn.disabled = false;

            saveBtn.textContent =
                "حفظ وإرسال للمراجعة";

        }
    );


    async function logout() {

        await supabaseClient.auth.signOut();

        window.location.href =
            "index.html";

    }


    loadEmployee();

</script>

</body>

</html>
