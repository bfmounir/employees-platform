<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>منصة إدارة الموظفين</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="config.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Tahoma, sans-serif;
            background:
                linear-gradient(135deg, #eef6ff, #f7fbff);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background: #ffffff;
            border-radius: 22px;
            padding: 35px 30px;
            box-shadow:
                0 15px 45px rgba(0, 60, 120, 0.12);
            border: 1px solid #e6eef7;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 18px;
            border-radius: 20px;
            background: linear-gradient(135deg, #087f8c, #0b5f78);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(8, 127, 140, 0.25);
        }

        h1 {
            text-align: center;
            margin: 0;
            color: #12344d;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #6b7c8f;
            margin: 10px 0 28px;
            line-height: 1.7;
            font-size: 14px;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .mode-btn {
            flex: 1;
            border: none;
            padding: 13px 8px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            background: #edf3f7;
            color: #526575;
            transition: 0.2s;
        }

        .mode-btn.active {
            background: #087f8c;
            color: white;
            box-shadow: 0 5px 15px rgba(8, 127, 140, 0.2);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #29475c;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d5e0e8;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            background: #fbfdff;
        }

        input:focus {
            border-color: #087f8c;
            box-shadow: 0 0 0 3px rgba(8, 127, 140, 0.08);
            background: white;
        }

        .login-btn {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 13px;
            background: linear-gradient(135deg, #087f8c, #0b607a);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(8, 127, 140, 0.2);
        }

        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            padding: 13px 15px;
            border-radius: 11px;
            margin-bottom: 18px;
            font-size: 14px;
            line-height: 1.6;
        }

        .message.error {
            display: block;
            background: #fff1f1;
            color: #a52828;
            border: 1px solid #ffd0d0;
        }

        .message.success {
            display: block;
            background: #effbf4;
            color: #18753c;
            border: 1px solid #c8efd5;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #8493a0;
            font-size: 12px;
            line-height: 1.7;
        }

        .institution {
            color: #087f8c;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 500px) {

            body {
                padding: 12px;
            }

            .card {
                padding: 28px 20px;
                border-radius: 18px;
            }

            h1 {
                font-size: 22px;
            }

            .logo {
                width: 70px;
                height: 70px;
                font-size: 32px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <div class="card">

        <div class="logo">
            👤
        </div>

        <h1>
            منصة إدارة الموظفين
        </h1>

        <div class="subtitle">

            المؤسسة العمومية الإستشفائية بأولف
            <br>
            ولاية أدرار

        </div>


        <div class="mode-buttons">

            <button
                type="button"
                id="employeeModeBtn"
                class="mode-btn active"
                onclick="setMode('employee')">

                دخول الموظفين

            </button>


            <button
                type="button"
                id="adminModeBtn"
                class="mode-btn"
                onclick="setMode('admin')">

                دخول المسؤول

            </button>

        </div>


        <div id="message" class="message"></div>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="أدخل البريد الإلكتروني"
                    autocomplete="email"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="أدخل كلمة المرور"
                    autocomplete="current-password"
                    required>

            </div>


            <button
                type="submit"
                id="loginBtn"
                class="login-btn">

                دخول الموظف

            </button>

        </form>


        <div class="footer">

            <div class="institution">
                منصة رقمية لمتابعة وتحديث بيانات الموظفين
            </div>

            <div>
                جميع الحقوق محفوظة
            </div>

        </div>

    </div>

</div>


<script>

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    let currentMode = "employee";


    function setMode(mode) {

        currentMode = mode;

        const employeeBtn =
            document.getElementById("employeeModeBtn");

        const adminBtn =
            document.getElementById("adminModeBtn");

        const loginBtn =
            document.getElementById("loginBtn");

        clearMessage();


        if (mode === "employee") {

            employeeBtn.classList.add("active");
            adminBtn.classList.remove("active");

            loginBtn.textContent =
                "دخول الموظف";

        } else {

            adminBtn.classList.add("active");
            employeeBtn.classList.remove("active");

            loginBtn.textContent =
                "دخول المسؤول";

        }

    }


    function showMessage(text, type = "error") {

        const message =
            document.getElementById("message");

        message.textContent = text;

        message.className =
            "message " + type;

    }


    function clearMessage() {

        const message =
            document.getElementById("message");

        message.textContent = "";

        message.className = "message";

    }


    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            clearMessage();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const loginBtn =
                document.getElementById("loginBtn");


            if (!email || !password) {

                showMessage(
                    "يرجى إدخال البريد الإلكتروني وكلمة المرور."
                );

                return;

            }


            loginBtn.disabled = true;

            loginBtn.textContent =
                "جاري التحقق...";


            try {

                /*
                 * تسجيل الدخول بواسطة Supabase Auth
                 */

                const {
                    data: authData,
                    error: authError
                } =
                    await supabaseClient.auth
                        .signInWithPassword({
                            email: email,
                            password: password
                        });


                if (authError) {

                    throw authError;

                }


                if (!authData || !authData.user) {

                    throw new Error(
                        "تعذر الحصول على بيانات الحساب."
                    );

                }


                const user =
                    authData.user;


                /*
                 * نحاول معرفة هل للمستخدم
                 * سجل سابق في employees
                 *
                 * إذا لم يوجد سجل:
                 * يسمح له بالدخول إلى employee.html
                 * ليقوم بإنشاء ملفه بنفسه.
                 */

                const {
                    data: employee,
                    error: employeeError
                } =
                    await supabaseClient
                        .from("employees")
                        .select(`
                            id,
                            role,
                            profile_status
                        `)
                        .eq("user_id", user.id)
                        .maybeSingle();


                if (employeeError) {

                    console.error(
                        "Employee query error:",
                        employeeError
                    );

                    throw new Error(
                        "حدث خطأ أثناء التحقق من ملف الموظف."
                    );

                }


                /*
                 * دخول المسؤول
                 */

                if (currentMode === "admin") {

                    if (!employee) {

                        await supabaseClient.auth.signOut();

                        throw new Error(
                            "هذا الحساب غير مرتبط بملف مسؤول في المنصة."
                        );

                    }


                    if (employee.role !== "admin") {

                        await supabaseClient.auth.signOut();

                        throw new Error(
                            "هذا الحساب ليس لديه صلاحيات المسؤول."
                        );

                    }


                    showMessage(
                        "تم تسجيل الدخول بنجاح، جاري فتح لوحة المسؤول...",
                        "success"
                    );


                    setTimeout(function() {

                        window.location.href =
                            "admin.html";

                    }, 500);


                    return;

                }


                /*
                 * دخول الموظف
                 */

                if (employee && employee.role === "admin") {

                    await supabaseClient.auth.signOut();

                    throw new Error(
                        "هذا الحساب مخصص للمسؤول. يرجى اختيار دخول المسؤول."
                    );

                }


                /*
                 * هنا النقطة المهمة:
                 *
                 * إذا كان الموظف لديه ملف سابق:
                 * يدخل إلى ملفه.
                 *
                 * إذا لم يكن لديه ملف:
                 * يدخل أيضا إلى employee.html
                 * وهناك سيتم إنشاء الملف عند الحفظ.
                 */

                showMessage(
                    "تم تسجيل الدخول بنجاح، جاري فتح ملف الموظف...",
                    "success"
                );


                setTimeout(function() {

                    window.location.href =
                        "employee.html";

                }, 500);


            } catch (error) {

                console.error(error);

                showMessage(
                    error.message ||
                    "حدث خطأ أثناء تسجيل الدخول."
                );


                try {

                    await supabaseClient.auth.signOut();

                } catch (logoutError) {

                    console.error(logoutError);

                }

            } finally {

                loginBtn.disabled = false;

                if (currentMode === "employee") {

                    loginBtn.textContent =
                        "دخول الموظف";

                } else {

                    loginBtn.textContent =
                        "دخول المسؤول";

                }

            }

        });


    /*
     * إذا كان المستخدم مسجلا بالفعل،
     * نحاول توجيهه مباشرة إلى الصفحة المناسبة.
     */

    async function checkExistingSession() {

        try {

            const {
                data
            } =
                await supabaseClient.auth.getSession();


            const session =
                data?.session;


            if (!session || !session.user) {

                return;

            }


            const user =
                session.user;


            const {
                data: employee,
                error
            } =
                await supabaseClient
                    .from("employees")
                    .select("role")
                    .eq("user_id", user.id)
                    .maybeSingle();


            if (error) {

                console.error(error);

                return;

            }


            if (employee && employee.role === "admin") {

                window.location.href =
                    "admin.html";

                return;

            }


            /*
             * حتى إذا لم يكن له سجل employees
             * نسمح له بالانتقال إلى صفحة الموظف.
             */

            window.location.href =
                "employee.html";

        } catch (error) {

            console.error(
                "Session check error:",
                error
            );

        }

    }


    checkExistingSession();

</script>

</body>

</html>
