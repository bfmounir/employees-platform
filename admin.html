<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>لوحة تحكم المسؤول</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

.header {
    background: linear-gradient(135deg, #0f766e, #2563eb);
    color: white;
    padding: 22px;
    box-shadow: 0 4px 15px rgba(0,0,0,.12);
}

.header-content {
    max-width: 1250px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.header h1 {
    margin: 0 0 7px;
    font-size: 25px;
}

.header p {
    margin: 0;
    opacity: .9;
    font-size: 14px;
}

.logout {
    border: none;
    background: rgba(255,255,255,.18);
    color: white;
    padding: 11px 18px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
}

.container {
    max-width: 1250px;
    margin: 25px auto;
    padding: 0 15px;
}

.loading {
    text-align: center;
    padding: 60px;
    font-size: 18px;
    color: #64748b;
}

.hidden {
    display: none !important;
}


/* الإحصائيات */

.stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.stat-title {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 10px;
}

.stat-number {
    font-size: 28px;
    font-weight: bold;
    color: #0f766e;
}


/* البطاقة */

.card {
    background: white;
    border-radius: 15px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.card-title {
    font-size: 20px;
    font-weight: bold;
    color: #0f766e;
    margin-bottom: 18px;
}


/* البحث */

.filters {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 12px;
}

input,
select,
textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    font-size: 14px;
    outline: none;
    background: white;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #2563eb;
}


/* الجدول */

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
}

th {
    background: #f8fafc;
    color: #475569;
    font-size: 14px;
    padding: 13px 10px;
    border-bottom: 2px solid #e2e8f0;
    text-align: right;
}

td {
    padding: 13px 10px;
    border-bottom: 1px solid #e2e8f0;
    font-size: 14px;
}

tr:hover {
    background: #f8fafc;
}


/* الشارات */

.badge {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.active {
    background: #dcfce7;
    color: #166534;
}

.seconded {
    background: #dbeafe;
    color: #1e40af;
}

.pending {
    background: #fef3c7;
    color: #92400e;
}

.approved {
    background: #dcfce7;
    color: #166534;
}

.correction {
    background: #fee2e2;
    color: #991b1b;
}


/* الأزرار */

.view-btn {
    border: none;
    background: #2563eb;
    color: white;
    padding: 8px 13px;
    border-radius: 7px;
    cursor: pointer;
}

.view-btn:hover {
    opacity: .9;
}


/* النافذة */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    z-index: 1000;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 850px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 18px;
    padding: 25px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 15px;
    margin-bottom: 20px;
}

.modal-header h2 {
    margin: 0;
    color: #0f766e;
}

.close {
    border: none;
    background: #f1f5f9;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
}

.details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.detail {
    background: #f8fafc;
    padding: 12px;
    border-radius: 9px;
}

.detail strong {
    display: block;
    color: #64748b;
    font-size: 12px;
    margin-bottom: 5px;
}

.detail span {
    font-size: 14px;
    word-break: break-word;
}

.full {
    grid-column: 1 / -1;
}

.modal-actions {
    margin-top: 22px;
    border-top: 1px solid #e2e8f0;
    padding-top: 20px;
}

.modal-actions textarea {
    min-height: 90px;
    resize: vertical;
    margin-bottom: 12px;
}

.action-buttons {
    display: flex;
    gap: 10px;
}

.approve-btn {
    background: #16a34a;
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 8px;
    cursor: pointer;
}

.correction-btn {
    background: #dc2626;
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 8px;
    cursor: pointer;
}

.message {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    display: none;
    text-align: center;
    font-weight: bold;
}

.message.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.message.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}


/* التنبيهات */

.deadline-warning {
    color: #b45309;
    font-weight: bold;
}

.deadline-danger {
    color: #dc2626;
    font-weight: bold;
}

.deadline-ok {
    color: #166534;
}


/* الهاتف */

@media (max-width: 900px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .filters {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 600px) {

    .header-content {
        flex-direction: column;
        align-items: stretch;
    }

    .logout {
        width: 100%;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .details {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .modal-box {
        padding: 18px;
    }

    .action-buttons {
        flex-direction: column;
    }

    .approve-btn,
    .correction-btn {
        width: 100%;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="header-content">

        <div>

            <h1>
                لوحة تحكم المسؤول
            </h1>

            <p>
                إدارة ومتابعة بيانات الموظفين
            </p>

        </div>

        <button class="logout"
                onclick="logout()">

            تسجيل الخروج

        </button>

    </div>

</header>


<div class="container">


<div id="loading"
     class="loading">

    جاري التحقق من صلاحيات المسؤول...

</div>


<div id="dashboard"
     class="hidden">


<!-- الإحصائيات -->

<div class="stats">

    <div class="stat">

        <div class="stat-title">
            إجمالي الموظفين
        </div>

        <div class="stat-number"
             id="totalCount">
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            نشطون
        </div>

        <div class="stat-number"
             id="activeCount">
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            تحت التصرف
        </div>

        <div class="stat-number"
             id="secondedCount">
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            قيد المراجعة
        </div>

        <div class="stat-number"
             id="pendingCount">
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            تحتاج تصحيح
        </div>

        <div class="stat-number"
             id="correctionCount">
            0
        </div>

    </div>

</div>


<!-- البحث -->

<div class="card">

    <div class="card-title">
        البحث والتصفية
    </div>

    <div class="filters">

        <input
            type="text"
            id="searchInput"
            placeholder="ابحث بالاسم، NIN، الرتبة، المصلحة..."
        >


        <select id="statusFilter">

            <option value="">
                جميع الوضعيات
            </option>

            <option value="active">
                نشط
            </option>

            <option value="seconded">
                موضوع تحت التصرف
            </option>

        </select>


        <select id="profileFilter">

            <option value="">
                جميع حالات الملفات
            </option>

            <option value="pending">
                قيد المراجعة
            </option>

            <option value="approved">
                مقبول
            </option>

            <option value="needs_correction">
                يحتاج تصحيح
            </option>

        </select>

    </div>

</div>


<!-- قائمة الموظفين -->

<div class="card">

    <div class="card-title">
        قائمة الموظفين
    </div>

    <div id="tableMessage"
         class="message">
    </div>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>الاسم واللقب</th>

                    <th>الرتبة</th>

                    <th>المصلحة</th>

                    <th>الوضعية</th>

                    <th>حالة الملف</th>

                    <th>نهاية التصرف</th>

                    <th>الإجراء</th>

                </tr>

            </thead>


            <tbody id="employeesTable">

            </tbody>

        </table>

    </div>

</div>


</div>

</div>


<!-- النافذة -->

<div id="employeeModal"
     class="modal hidden">

    <div class="modal-box">


        <div class="modal-header">

            <h2>
                تفاصيل الموظف
            </h2>

            <button class="close"
                    onclick="closeModal()">
                ×
            </button>

        </div>


        <div id="modalDetails"
             class="details">
        </div>


        <div class="modal-actions">

            <textarea
                id="adminNote"
                placeholder="اكتب ملاحظة للموظف عند طلب التصحيح...">
            </textarea>


            <div class="action-buttons">

                <button
                    class="approve-btn"
                    onclick="approveEmployee()">

                    قبول البيانات

                </button>


                <button
                    class="correction-btn"
                    onclick="requestCorrection()">

                    طلب تصحيح

                </button>

            </div>

        </div>


    </div>

</div>


<script>


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let allEmployees = [];

let selectedEmployee = null;


const loading =
    document.getElementById("loading");

const dashboard =
    document.getElementById("dashboard");


/* التحقق من المسؤول */

async function checkAdmin() {

    try {

        const {
            data: {
                user
            },
            error
        } =
        await supabaseClient.auth.getUser();


        if (error || !user) {

            window.location.href =
                "index.html";

            return;

        }


        const {
            data: employee,
            error: employeeError
        } =
        await supabaseClient
            .from("employees")
            .select("role")
            .eq("user_id", user.id)
            .single();


        if (employeeError ||
            !employee ||
            employee.role !== "admin") {

            alert(
                "ليس لديك صلاحية الدخول إلى لوحة المسؤول."
            );

            window.location.href =
                "index.html";

            return;

        }


        loading.classList.add("hidden");

        dashboard.classList.remove("hidden");


        await loadEmployees();


    } catch (error) {

        console.error(error);

        loading.textContent =
            "حدث خطأ أثناء التحقق من الصلاحيات.";

    }

}


/* تحميل الموظفين */

async function loadEmployees() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("employees")
            .select("*")
            .order("created_at", {
                ascending: false
            });


        if (error) {

            throw error;

        }


        allEmployees = data || [];


        updateStatistics();

        renderEmployees();


    } catch (error) {

        console.error(error);

        showTableMessage(
            "حدث خطأ أثناء تحميل الموظفين.",
            "error"
        );

    }

}


/* الإحصائيات */

function updateStatistics() {

    document.getElementById("totalCount")
        .textContent =
        allEmployees.length;


    document.getElementById("activeCount")
        .textContent =
        allEmployees.filter(
            e => e.work_status === "active"
        ).length;


    document.getElementById("secondedCount")
        .textContent =
        allEmployees.filter(
            e => e.work_status === "seconded"
        ).length;


    document.getElementById("pendingCount")
        .textContent =
        allEmployees.filter(
            e => e.profile_status === "pending"
        ).length;


    document.getElementById("correctionCount")
        .textContent =
        allEmployees.filter(
            e => e.profile_status === "needs_correction"
        ).length;

}


/* عرض الموظفين */

function renderEmployees() {

    const tbody =
        document.getElementById("employeesTable");


    const search =
        document.getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    const status =
        document.getElementById("statusFilter")
            .value;


    const profile =
        document.getElementById("profileFilter")
            .value;


    const filtered =
        allEmployees.filter(employee => {

            const searchable = [

                employee.nom_ar,
                employee.nom_fr,
                employee.nin,
                employee.grade,
                employee.service_ar,
                employee.service_fr,
                employee.poste_ar,
                employee.poste_fr,
                employee.lieu_travail_ar,
                employee.lieu_travail_fr,
                employee.host_institution

            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


            const matchesSearch =
                !search ||
                searchable.includes(search);


            const matchesStatus =
                !status ||
                employee.work_status === status;


            const matchesProfile =
                !profile ||
                employee.profile_status === profile;


            return (
                matchesSearch &&
                matchesStatus &&
                matchesProfile
            );

        });


    tbody.innerHTML = "";


    if (filtered.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="7"
                    style="text-align:center;padding:30px;color:#64748b;">
                    لا توجد نتائج
                </td>
            </tr>
        `;

        return;

    }


    filtered.forEach(employee => {

        const tr =
            document.createElement("tr");


        tr.innerHTML = `

            <td>
                <strong>
                    ${escapeHtml(employee.nom_ar || "-")}
                </strong>
                <br>
                <small>
                    ${escapeHtml(employee.nom_fr || "")}
                </small>
            </td>

            <td>
                ${escapeHtml(employee.grade || "-")}
            </td>

            <td>
                ${escapeHtml(employee.service_ar || "-")}
            </td>

            <td>
                ${getWorkStatusBadge(employee)}
            </td>

            <td>
                ${getProfileStatusBadge(employee)}
            </td>

            <td>
                ${getDeadline(employee)}
            </td>

            <td>

                <button
                    class="view-btn"
                    onclick="openEmployee('${employee.id}')">

                    عرض الملف

                </button>

            </td>

        `;


        tbody.appendChild(tr);

    });

}


/* وضعية الموظف */

function getWorkStatusBadge(employee) {

    if (employee.work_status === "seconded") {

        return `
            <span class="badge seconded">
                تحت التصرف
            </span>
        `;

    }


    return `
        <span class="badge active">
            نشط
        </span>
    `;

}


/* حالة الملف */

function getProfileStatusBadge(employee) {

    if (employee.profile_status === "approved") {

        return `
            <span class="badge approved">
                مقبول
            </span>
        `;

    }


    if (employee.profile_status === "needs_correction") {

        return `
            <span class="badge correction">
                يحتاج تصحيح
            </span>
        `;

    }


    return `
        <span class="badge pending">
            قيد المراجعة
        </span>
    `;

}


/* تاريخ نهاية التصرف */

function getDeadline(employee) {

    if (
        employee.work_status !== "seconded" ||
        !employee.disposition_end
    ) {

        return "-";

    }


    const end =
        new Date(
            employee.disposition_end + "T00:00:00"
        );


    const today =
        new Date();


    today.setHours(0,0,0,0);


    const difference =
        Math.ceil(
            (end - today) /
            (1000 * 60 * 60 * 24)
        );


    const date =
        formatDate(employee.disposition_end);


    if (difference < 0) {

        return `
            <span class="deadline-danger">
                منتهية
                <br>
                ${date}
            </span>
        `;

    }


    if (difference <= 30) {

        return `
            <span class="deadline-warning">
                ${difference} يوم
                <br>
                ${date}
            </span>
        `;

    }


    return `
        <span class="deadline-ok">
            ${date}
        </span>
    `;

}


/* فتح ملف موظف */

function openEmployee(id) {

    selectedEmployee =
        allEmployees.find(
            e => e.id === id
        );


    if (!selectedEmployee) {

        return;

    }


    const e =
        selectedEmployee;


    document.getElementById("modalDetails")
        .innerHTML = `

        <div class="detail">
            <strong>الاسم واللقب بالعربية</strong>
            <span>${escapeHtml(e.nom_ar || "-")}</span>
        </div>

        <div class="detail">
            <strong>Nom et prénom</strong>
            <span>${escapeHtml(e.nom_fr || "-")}</span>
        </div>

        <div class="detail">
            <strong>منصب العمل</strong>
            <span>${escapeHtml(e.poste_ar || "-")}</span>
        </div>

        <div class="detail">
            <strong>Poste de travail</strong>
            <span>${escapeHtml(e.poste_fr || "-")}</span>
        </div>

        <div class="detail">
            <strong>مكان العمل</strong>
            <span>${escapeHtml(e.lieu_travail_ar || "-")}</span>
        </div>

        <div class="detail">
            <strong>Lieu de travail</strong>
            <span>${escapeHtml(e.lieu_travail_fr || "-")}</span>
        </div>

        <div class="detail">
            <strong>الرتبة</strong>
            <span>${escapeHtml(e.grade || "-")}</span>
        </div>

        <div class="detail">
            <strong>NIN</strong>
            <span>${escapeHtml(e.nin || "-")}</span>
        </div>

        <div class="detail">
            <strong>البريد الإلكتروني</strong>
            <span>${escapeHtml(e.email || "-")}</span>
        </div>

        <div class="detail">
            <strong>الهاتف</strong>
            <span>${escapeHtml(e.phone || "-")}</span>
        </div>

        <div class="detail">
            <strong>المصلحة / المكتب</strong>
            <span>${escapeHtml(e.service_ar || "-")}</span>
        </div>

        <div class="detail">
            <strong>Service / Bureau</strong>
            <span>${escapeHtml(e.service_fr || "-")}</span>
        </div>

        <div class="detail">
            <strong>الوضعية</strong>
            <span>
                ${e.work_status === "seconded"
                    ? "موضوع تحت التصرف"
                    : "نشط"}
            </span>
        </div>

        <div class="detail">
            <strong>حالة الملف</strong>
            <span>
                ${getProfileStatusText(e.profile_status)}
            </span>
        </div>

        ${
            e.work_status === "seconded"
            ? `

            <div class="detail full">
                <strong>المؤسسة المستقبلة</strong>
                <span>
                    ${escapeHtml(e.host_institution || "-")}
                </span>
            </div>

            <div class="detail">
                <strong>المصلحة لدى المؤسسة المستقبلة</strong>
                <span>
                    ${escapeHtml(e.host_service || "-")}
                </span>
            </div>

            <div class="detail">
                <strong>بداية الوضع تحت التصرف</strong>
                <span>
                    ${formatDate(e.disposition_start)}
                </span>
            </div>

            <div class="detail">
                <strong>نهاية الوضع تحت التصرف</strong>
                <span>
                    ${formatDate(e.disposition_end)}
                </span>
            </div>

            `
            : ""
        }

        <div class="detail full">
            <strong>ملاحظة المسؤول الحالية</strong>
            <span>
                ${escapeHtml(e.admin_note || "لا توجد ملاحظة")}
            </span>
        </div>

    `;


    document.getElementById("adminNote")
        .value = "";


    document.getElementById("employeeModal")
        .classList.remove("hidden");

}


/* حالة الملف كنص */

function getProfileStatusText(status) {

    if (status === "approved") {

        return "مقبول";

    }

    if (status === "needs_correction") {

        return "يحتاج إلى تصحيح";

    }

    return "قيد المراجعة";

}


/* قبول الموظف */

async function approveEmployee() {

    if (!selectedEmployee) {

        return;

    }


    const {
        error
    } =
    await supabaseClient
        .from("employees")
        .update({
            profile_status: "approved",
            admin_note: null
        })
        .eq("id", selectedEmployee.id);


    if (error) {

        alert(
            "حدث خطأ أثناء قبول الملف: " +
            error.message
        );

        return;

    }


    closeModal();

    await loadEmployees();

}


/* طلب التصحيح */

async function requestCorrection() {

    if (!selectedEmployee) {

        return;

    }


    const note =
        document.getElementById("adminNote")
            .value
            .trim();


    if (!note) {

        alert(
            "يرجى كتابة ملاحظة توضح للموظف ما يجب تصحيحه."
        );

        return;

    }


    const {
        error
    } =
    await supabaseClient
        .from("employees")
        .update({
            profile_status: "needs_correction",
            admin_note: note
        })
        .eq("id", selectedEmployee.id);


    if (error) {

        alert(
            "حدث خطأ أثناء إرسال طلب التصحيح: " +
            error.message
        );

        return;

    }


    closeModal();

    await loadEmployees();

}


/* إغلاق النافذة */

function closeModal() {

    document.getElementById("employeeModal")
        .classList.add("hidden");

    selectedEmployee = null;

}


/* البحث والتصفية */

document.getElementById("searchInput")
    .addEventListener(
        "input",
        renderEmployees
    );


document.getElementById("statusFilter")
    .addEventListener(
        "change",
        renderEmployees
    );


document.getElementById("profileFilter")
    .addEventListener(
        "change",
        renderEmployees
    );


/* التاريخ */

function formatDate(date) {

    if (!date) {

        return "-";

    }


    const parts =
        date.split("-");


    if (parts.length !== 3) {

        return date;

    }


    return (
        parts[2] +
        "/" +
        parts[1] +
        "/" +
        parts[0]
    );

}


/* حماية عرض النصوص */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* رسالة */

function showTableMessage(text, type) {

    const box =
        document.getElementById("tableMessage");


    box.textContent = text;

    box.className =
        "message " + type;

}


/* تسجيل الخروج */

async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
        "index.html";

}
